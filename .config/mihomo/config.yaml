# ══════════════════════════════════════════════════════════════
# Mihomo 最小可用配置
# ══════════════════════════════════════════════════════════════
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

external-controller: 127.0.0.1:9090
external-ui: ui

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip:   "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

# ── TUN
tun:
  enable: true
  stack: mixed
  device: mihomo
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  mtu: 1500

# ── DNS
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.stun.*.*"
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  nameserver:
    - system
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

# ── 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:  { ports: [80, 8080-8880], override-destination: true }
    TLS:   { ports: [443, 8443] }
    QUIC:  { ports: [443, 8443] }

# ── 机场订阅
# 在每台设备部署后，将下面两个占位符替换为各自的私人订阅地址。
proxy-providers:
  main:
    type: http
    url: "<MAIN_SUBSCRIPTION_URL>"
    interval: 86400
    path: ./proxy_providers/main.yaml
    filter: "^(?!.*(剩余|到期|官网|免费|试用|套餐|重置|过期|流量|时间|邮箱|客服|订阅)).*$"
    health-check: { enable: true, url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true }
  backup:
    type: http
    url: "<BACKUP_SUBSCRIPTION_URL>"
    interval: 86400
    path: ./proxy_providers/backup.yaml
    filter: "^(?!.*(剩余|到期|官网|免费|试用|套餐|重置|过期|流量|时间|邮箱|客服|订阅)).*$"
    health-check: { enable: true, url: "https://www.gstatic.com/generate_204", interval: 300, lazy: true }

# ── 代理组
proxy-groups:
  - name: "节点选择"
    type: select
    proxies: ["主用自动", "备用自动", "主用手动", "备用手动", DIRECT]

  - name: "主用自动"
    type: url-test
    use: [main]
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "备用自动"
    type: url-test
    use: [backup]
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "主用手动"
    type: select
    use: [main]

  - name: "备用手动"
    type: select
    use: [backup]

  # AIGC 按地区筛选节点，并在各地区内自动选择低延迟节点。
  - name: "AIGC"
    type: select
    proxies: ["AI 节点自动", "新加坡自动", "日本自动", "美国自动", "台湾自动"]

  - name: "AI 节点自动"
    type: url-test
    use: [main, backup]
    filter: '(?i)ChatGPT|\bAI\b'
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "新加坡自动"
    type: url-test
    use: [main, backup]
    filter: "(?i)新加坡|Singapore|🇸🇬"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "日本自动"
    type: url-test
    use: [main, backup]
    filter: "(?i)日本|Japan|🇯🇵"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "美国自动"
    type: url-test
    use: [main, backup]
    filter: "(?i)美国|United States|USA|🇺🇸"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "台湾自动"
    type: url-test
    use: [main, backup]
    filter: "(?i)台湾|Taiwan|TW|🇹🇼"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "兜底策略"
    type: select
    proxies: ["节点选择", DIRECT]

# ── 远程规则集
rule-providers:
  bing:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/bing.yaml
    url: "https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Bing/Bing.yaml"
    interval: 86400

  copilot:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/copilot.yaml
    url: "https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Copilot/Copilot.yaml"
    interval: 86400

  bard:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/bard.yaml
    url: "https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/BardAI/BardAI.yaml"
    interval: 86400

  openai:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/openai.yaml
    url: "https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OpenAI/OpenAI.yaml"
    interval: 86400

  claude:
    type: http
    behavior: classical
    format: yaml
    path: ./ruleset/claude.yaml
    url: "https://testingcf.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Claude/Claude.yaml"
    interval: 86400

# ── 路由规则
rules:
  - DOMAIN,localhost,DIRECT
  - DOMAIN-KEYWORD,opencode,AIGC
  - RULE-SET,bing,AIGC
  - RULE-SET,copilot,AIGC
  - RULE-SET,bard,AIGC
  - RULE-SET,openai,AIGC
  - RULE-SET,claude,AIGC
  - GEOSITE,CN,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,兜底策略
